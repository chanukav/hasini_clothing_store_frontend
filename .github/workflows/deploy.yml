name: Build & Deploy Frontend to AWS EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Docker Image and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_SUPABASE_BUCKET_ID=${{ secrets.VITE_SUPABASE_BUCKET_ID }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hasini-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hasini-frontend:${{ github.sha }}

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "Starting Frontend deployment on AWS EC2..."

            # Pull latest frontend image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/hasini-frontend:latest

            # Stop and remove existing container if running
            docker stop hasini-frontend || true
            docker rm hasini-frontend || true

            # Run new frontend container on port 80
            docker run -d \
              --name hasini-frontend \
              --restart always \
              -p 80:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/hasini-frontend:latest

            # Clean up old unused images
            docker image prune -f

            echo "Frontend successfully deployed!"
