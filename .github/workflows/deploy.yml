name: Build & Deploy Frontend to AWS EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Docker Image and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_SUPABASE_BUCKET_ID=${{ secrets.VITE_SUPABASE_BUCKET_ID }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hasini-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hasini-frontend:${{ github.sha }}

      - name: Deploy to AWS EC2 via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "Starting Frontend deployment on AWS EC2 via Docker Compose..."

            # Ensure app directory exists
            mkdir -p ~/app
            cd ~/app

            # Write or update docker-compose.yml
            cat << 'EOF' > docker-compose.yml
            services:
              backend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/hasini-backend:latest
                container_name: hasini-backend
                restart: always
                ports:
                  - "5000:5000"
                env_file:
                  - .env.backend
                networks:
                  - app-network

              frontend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/hasini-frontend:latest
                container_name: hasini-frontend
                restart: always
                ports:
                  - "80:80"
                depends_on:
                  - backend
                networks:
                  - app-network

            networks:
              app-network:
                driver: bridge
            EOF

            # Pull latest frontend image and update the container seamlessly
            docker compose pull frontend
            docker compose up -d --no-deps frontend

            # Clean up dangling images to save disk space
            docker image prune -f

            echo "Frontend successfully deployed with Docker Compose!"
